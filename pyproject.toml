[project]
name = "avi"
version = "0.0.1"
description = "Cerebro autonomo que coordina luces DMX (ENTTEC directo) y visuales (TouchDesigner) segun la musica."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "python-osc>=1.8",
    "sounddevice>=0.4",
    "pyserial>=3.5",
]

[project.scripts]
avi = "avi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["avi*"]
