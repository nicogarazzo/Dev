# Mapa de hardware de luces. La fase local L2 crea config/fixtures.yaml a partir de este.
# Todo lo marcado VERIFICAR es un supuesto hasta que L2 lo confirme.

# Salida DMX directa (avi/outputs/dmx.py). "EMU" es el software de ENTTEC y su control
# MIDI es de pago, asi que AVI habla con el hardware ENTTEC sin pasar por EMU.
# Ver docs/hardware/emu_y_luces.md.
dmx:
  backend: enttec_pro           # VERIFICAR en L2: enttec_pro | artnet | null
  serial_port: "VERIFICAR"      # /dev/tty.usbserial-EN... (python scripts/dmx_probe.py --list)
  host: 255.255.255.255         # solo artnet
  universe: 0

# Solo si el hardware resultara ser una caja MIDI->DMX de otra marca (nota = canal DMX).
emu_midi:
  enabled: false
  midi_port: "VERIFICAR"
  mode: note
  midi_channel_base: 1
  dmx_offset: 1
  value_scale: 2

# Perfiles de luz (canales relativos a la direccion DMX de inicio de cada luz)
profiles:
  par_rgbw_8ch:                 # VERIFICAR con el manual o el menu de la luz
    channels: 8
    dimmer: 1
    red: 2
    green: 3
    blue: 4
    white: 5
    strobe: 6
    mode: 7                     # dejar en 0 para control manual
    speed: 8

# Luces instaladas. group decide que bandas les afectan (ver config/show.example.yaml)
fixtures:
  - { name: par_1, profile: par_rgbw_8ch, address: 1,  group: front }
  - { name: par_2, profile: par_rgbw_8ch, address: 9,  group: front }
  - { name: par_3, profile: par_rgbw_8ch, address: 17, group: back }
  - { name: par_4, profile: par_rgbw_8ch, address: 25, group: back }
