# Capa de hardware (patch). La fase local L2 y la UI (F4) crean config/fixtures.yaml
# a partir de este. Todo lo marcado VERIFICAR es un supuesto hasta confirmarlo.
# Ver docs/PLAN_MVP.md, seccion 5, y docs/hardware/emu_y_luces.md.

# Como salen los bytes DMX (backends en avi/outputs/dmx.py). El cerebro nunca habla
# con esto directamente. "EMU" es software de ENTTEC; AVI manda DMX directo al hardware.
outputs:
  enttec_pro:
    type: enttec_pro              # ENTTEC DMX USB Pro / Mk2 o clon "Pro compatible"
    serial_port: "VERIFICAR"      # ej. /dev/tty.usbserial-EN123456 (python scripts/dmx_probe.py --list)
    fps: 40
  artnet:
    type: artnet                  # nodo Art-Net (ODE, EMU Hardware Interface por Ethernet, nodos chinos)
    host: 255.255.255.255         # o la IP del nodo
    universe: 0
  null:
    type: null                    # para tests y --dry-run: no envia nada

default_output: enttec_pro        # VERIFICAR en L2 cual de los dos es tu interfaz

# Perfiles de luz: que hace cada canal (relativo a la direccion de inicio).
# Se editan en la UI o se importan de Open Fixture Library (open-fixture-library.org).
profiles:
  par_rgbw_8ch:                   # VERIFICAR con dmx_probe.py --sweep o el manual de la luz
    channels: 8
    dimmer: 1
    red: 2
    green: 3
    blue: 4
    white: 5
    strobe: 6
    mode: 7                       # dejar en 0 para control manual
    speed: 8

# Luces concretas.
fixtures:
  - { name: par_1, profile: par_rgbw_8ch, address: 1,  output: enttec_pro }
  - { name: par_2, profile: par_rgbw_8ch, address: 9,  output: enttec_pro }
  - { name: par_3, profile: par_rgbw_8ch, address: 17, output: enttec_pro }
  - { name: par_4, profile: par_rgbw_8ch, address: 25, output: enttec_pro }

# Grupos: el cerebro habla de intenciones (dimmer, color, strobe) sobre grupos.
# delay_ms se aplica por posicion en el grupo -> olas, barridos y chases.
groups:
  all:   { members: [par_1, par_2, par_3, par_4], order: left_to_right, delay_ms: 0 }
  front: { members: [par_1, par_2],               order: left_to_right, delay_ms: 0 }
  back:  { members: [par_3, par_4],               order: left_to_right, delay_ms: 60 }
  wave:  { members: [par_1, par_2, par_3, par_4], order: center_out,    delay_beats: 0.125 }
