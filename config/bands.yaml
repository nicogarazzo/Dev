# Rastreadores adaptativos por instrumento (F1).
# Los filtros NO son fijos: cada rastreador parte de su rango nominal, busca su
# instrumento dentro de `search_hz` y reajusta su huella espectral continuamente.
# Ver docs/PLAN_MVP.md, seccion 4.
sample_rate: 48000
block_size: 512        # ~11 ms por bloque a 48 kHz
fft_size: 2048
hop_size: 512

trackers:
  sub:   { nominal_hz: [20, 60],     search_hz: [20, 90],     character: tonal,     onset: false, label: "808 / sub-bass" }
  kick:  { nominal_hz: [60, 150],    search_hz: [40, 200],    character: transient, onset: true,  label: "bombo" }
  bass:  { nominal_hz: [150, 400],   search_hz: [60, 500],    character: tonal,     onset: false, label: "bajo" }
  voice: { nominal_hz: [400, 2000],  search_hz: [250, 4000],  character: sustained, onset: false, label: "voces / synths" }
  snare: { nominal_hz: [2000, 6000], search_hz: [1000, 8000], character: transient, onset: true,  label: "snare / clap" }
  hats:  { nominal_hz: [6000, 16000],search_hz: [4000, 18000],character: transient, onset: true,  label: "hats / platos" }

adaptation:
  template_time_constant_s: 4.0   # que tan rapido se actualiza la huella espectral (2-8 s)
  center_max_shift_per_s: 0.05    # fraccion del rango de busqueda que el centro puede moverse por segundo
  hysteresis: 0.15                # cambio minimo relativo para mover la huella
  min_confidence: 0.3             # por debajo, el rastreador vuelve al rango nominal
  mask: wiener                    # reparto de energia por bin entre rastreadores

# Suavizado del nivel de cada instrumento (0 = sin suavizar, 1 = congelado)
smoothing:
  attack: 0.2
  release: 0.85

# Separacion (F1). Antes de repartir entre rastreadores, cada frame se divide en
# parte percusiva (golpes) y parte armonica (notas sostenidas) con una mediana
# causal en el tiempo. Los rastreadores `transient` escuchan la percusiva y los
# `tonal`/`sustained` la armonica; asi el bombo y el bajo no se roban energia
# aunque compartan frecuencias.
separation:
  hpss_frames: 9          # ventana de la mediana causal (~96 ms)
  nmf_iterations: 8       # iteraciones de la mascara suave por frame
  prior_pull_s: 30.0      # cuanto tira la huella de vuelta a su rango nominal
  silence_db: -65.0       # por debajo de esto (dBFS) el frame cuenta como silencio

onsets:
  threshold_k: 1.5        # umbral adaptativo = media + k * desviacion (ultimos ~1.5 s)
  relative_min: 0.2       # ademas, >= 20 % del pico reciente del rastreador
  min_interval_s: 0.08    # periodo refractario entre golpes del mismo rastreador

tempo:
  bpm_range: [70, 180]
  prior_bpm: 120          # desempata errores de octava (64 vs 128)
  window_s: 8.0           # historia usada para estimar el BPM
  update_s: 0.5
