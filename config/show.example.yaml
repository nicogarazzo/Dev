# Como el cerebro traduce instrumentos a luces y visuales, y que escenas existen.

outputs:
  touchdesigner: { osc_host: 127.0.0.1, osc_port: 9000 }
  midi_mirror:   { enabled: true, port: "Driver IAC Bus 1" }   # en la Mac: bus IAC ya existente

control:
  midi_in_port: "Driver IAC Bus 2"   # o el puerto de tu controlador MIDI (L4 lo confirma)

ui:
  host: 127.0.0.1
  port: 8080

# Instrumento (rastreador adaptativo) -> intencion sobre un grupo de luces
# (los grupos y sus delays viven en config/fixtures.yaml) y parametro de TouchDesigner.
mapping:
  sub:   { lights: { all:   dimmer_base },  td: scale_slow }
  kick:  { lights: { front: dimmer_flash }, td: zoom_pulse }
  bass:  { lights: { all:   hue_shift },    td: noise_amp }
  voice: { lights: { all:   white },        td: brightness }
  snare: { lights: { all:   strobe },       td: glitch, only_sections: [drop] }
  hats:  { lights: { wave:  chase },        td: sparkle_rate }

# Paletas: 3 colores RGB 0-1. Luces y visuales usan siempre la misma.
palettes:
  frio:    [[0.1, 0.3, 1.0], [0.0, 0.8, 0.9], [0.6, 0.6, 1.0]]
  fuego:   [[1.0, 0.2, 0.0], [1.0, 0.6, 0.0], [1.0, 1.0, 0.8]]
  neon:    [[1.0, 0.1, 0.4], [0.1, 0.3, 1.0], [1.0, 1.0, 1.0]]

# Escenas: indice de escena en TouchDesigner + clip propio (touchdesigner/clips/) + paletas permitidas
scenes:
  - { id: 0, name: ambiente, td_scene: 0, td_clip: 1, palettes: [frio],        sections: [calm, break] }
  - { id: 1, name: subida,   td_scene: 1, td_clip: 2, palettes: [frio, neon],  sections: [build] }
  - { id: 2, name: drop,     td_scene: 2, td_clip: 3, palettes: [fuego, neon], sections: [drop] }

rules:
  phrase_beats: 16          # cambios de escena cuantizados a frase
  min_scene_bars: 8
  section_hysteresis_bars: 2
  palette_fade_beats: 4     # cruce de paleta al cambiar de escena (el drop entra en seco)
  section_gain: { calm: 0.6, build: 0.75, drop: 1.0, break: 0.35 }   # techo de dimmer por seccion
  strobe_sections: [drop]
  # Umbrales del detector de secciones (por compas). Opcional: estos son los de fabrica.
  # Ver docs/F2_CEREBRO.md.
  sections:
    kick_hits_present: 2    # golpes de bombo por compas para "hay bombo"
    kick_hits_dense: 3      # ... para "bombo denso" (drop)
    drop_db_from_peak: 4.0  # el drop suena a <= 4 dB del compas mas fuerte reciente
    drop_hold_db: 8.0       # el drop se suelta si cae mas de 8 dB
    drop_jump_db: 3.0       # salto vs los 4 compases previos: drop inmediato tras build o break
    build_bars: 4           # ventana para medir la subida
    build_density_slope: 0.5
    build_db_slope: 0.6
